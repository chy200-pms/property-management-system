    <script>
        DemoMode.sync();

        // ==================== 路由 ====================
        const routes = [
            { path: '/', redirect: '/dashboard' },
            { path: '/dashboard', component: { template: '<page-dashboard/>' }, meta: { title: '首页看板' } },
            { path: '/bigscreen', component: { template: '<page-bigscreen/>' }, meta: { title: '数据大屏' } },
            { path: '/community3d', component: { template: '<page-community3d/>' }, meta: { title: '3D 小区地图' } },
            { path: '/building', component: { template: '<page-building/>' }, meta: { title: '楼栋管理' } },
            { path: '/house', component: { template: '<page-house/>' }, meta: { title: '房屋管理' } },
            { path: '/owner', component: { template: '<page-owner/>' }, meta: { title: '人员信息' } },
            { path: '/parking', component: { template: '<page-parking/>' }, meta: { title: '车位管理' } },
            { path: '/tempParking', component: { template: '<page-temp-parking/>' }, meta: { title: '临时停车' } },
            { path: '/feeStandard', component: { template: '<page-fee-standard/>' }, meta: { title: '收费标准' } },
            { path: '/feeBill', component: { template: '<page-fee-bill/>' }, meta: { title: '物业费账单' } },
            { path: '/feePayment', component: { template: '<page-fee-payment/>' }, meta: { title: '缴费记录' } },
            { path: '/repair', component: { template: '<page-repair/>' }, meta: { title: '报修管理' } },
            { path: '/complaint', component: { template: '<page-complaint/>' }, meta: { title: '投诉建议' } },
            { path: '/notice', component: { template: '<page-notice/>' }, meta: { title: '通知公告' } },
            { path: '/visitor', component: { template: '<page-visitor/>' }, meta: { title: '访客登记' } },
            { path: '/equipment', component: { template: '<page-equipment/>' }, meta: { title: '设备设施' } },
            { path: '/user', component: { template: '<page-user/>' }, meta: { title: '用户管理' } },
            { path: '/syslog', component: { template: '<page-syslog/>' }, meta: { title: '操作日志' } },
            // 兜底路由: 必须放在最后。
            // 地址栏 hash 落在任何未登记的路径时(例如历史遗留的 #/redirect/xxx、手工改错的地址),
            // 一律回到首页看板, 而不是让 <router-view> 因"无匹配组件"渲染出一片空白。
            { path: '*', redirect: '/dashboard' }
        ];

        const router = new VueRouter({ routes });

        // ==================== 主应用 ====================
        new Vue({
            el: '#app',
            router,
            data() {
                return {
                    collapse: false,
                    user: PmsUtils.currentUser(),
                    pwdVisible: false,
                    baseURL: AppConfig.baseURL,
                    backendDown: false,
                    pwdForm: { oldPassword: '', newPassword: '', confirmPassword: '' }
                };
            },
            computed: {
                activeMenu() {
                    return this.$route.path;
                },
                currentTitle() {
                    return (this.$route.meta && this.$route.meta.title) || '物业管理系统';
                },
                isDemo() {
                    return DemoMode.isOn();
                },
                isAdmin() {
                    return this.user.role === 'ADMIN';
                },
                roleLabel() {
                    return PmsUtils.label('userRole', this.user.role);
                },
                avatarText() {
                    const n = this.user.realName || 'U';
                    return n.substring(n.length - 2);
                }
            },
            created() {
                // 登录校验
                if (!localStorage.getItem('pms_token')) {
                    location.href = 'index.html';
                    return;
                }
                // 若当前处于演示模式，先探测后端：后端已启动则自动切回真实数据并重新登录
                // (演示模式下的 token 是本地伪造的, 真实后端不认识, 必须重新登录)
                if (this.isDemo) {
                    Api.ping().then(ok => {
                        if (ok) {
                            DemoMode.disable();
                            DemoMode.sync();
                            localStorage.removeItem('pms_token');
                            localStorage.removeItem('pms_user');
                            this.$message.success('检测到后端服务，正在切换为真实数据，请重新登录...');
                            setTimeout(() => { location.href = 'index.html'; }, 800);
                        }
                    });
                    return;
                }
                // 后台校验登录态(演示模式跳过)
                if (!this.isDemo) {
                    Api.currentUser().then(res => {
                        if (res.data) {
                            this.user = res.data;
                            localStorage.setItem('pms_user', JSON.stringify(res.data));
                        }
                        this.backendDown = false;
                    }).catch(err => {
                        // 后端连不上时明确提示, 避免页面一片空白却看不出原因
                        const msg = (err && err.message) || '加载用户信息失败';
                        if (/无法连接后端服务/.test(msg)) {
                            this.backendDown = true;
                            this.$message.error(msg);
                        }
                    });
                }
            },
            methods: {
                refresh() {
                    // 整页重载。
                    // 说明: 早期版本这里用 $router.replace('/redirect' + path) 想"重挂路由",
                    // 但路由表里并没有 /redirect/:path 这条路由, 于是 <router-view> 匹配不到组件,
                    // 内容区直接空白; 更麻烦的是地址栏 hash 被改成了 #/redirect/xxx,
                    // 用户以为只是"刷新了一下", 再按 F5 依旧空白。改用整页重载彻底绕开。
                    location.reload();
                },
                // 后端恢复后重试: 重新探测, 成功则重新加载页面
                retryBackend() {
                    Api.ping().then(ok => {
                        if (ok) {
                            this.$message.success('已连接后端服务，正在重新加载...');
                            setTimeout(() => location.reload(), 600);
                        } else {
                            this.$message.error('仍无法连接后端服务（' + this.baseURL + '），请确认后端已启动');
                        }
                    });
                },
                onUserCommand(cmd) {
                    if (cmd === 'logout') {
                        this.$confirm('确定要退出登录吗？', '提示', { type: 'warning' })
                            .then(() => {
                                Api.logout().catch(() => { });
                                localStorage.removeItem('pms_token');
                                localStorage.removeItem('pms_token_exp');
                                localStorage.removeItem('pms_user');
                                location.href = 'index.html';
                            })
                            .catch(() => { });
                    } else if (cmd === 'password') {
                        this.pwdForm = { oldPassword: '', newPassword: '', confirmPassword: '' };
                        this.pwdVisible = true;
                    }
                },
                submitPassword() {
                    const f = this.pwdForm;
                    if (!f.oldPassword || !f.newPassword) {
                        return this.$message.warning('请填写完整');
                    }
                    if (f.newPassword !== f.confirmPassword) {
                        return this.$message.warning('两次输入的新密码不一致');
                    }
                    if (f.newPassword.length < 6) {
                        return this.$message.warning('新密码长度不能少于 6 位');
                    }
                    if (this.isDemo) {
                        this.pwdVisible = false;
                        return this.$message.success('演示模式下密码修改已模拟成功');
                    }
                    Api.changePassword({ oldPassword: f.oldPassword, newPassword: f.newPassword })
                        .then(() => {
                            this.pwdVisible = false;
                            // 改密后后端会作废该账号全部历史令牌(token_version 自增),
                            // 当前会话也已失效, 因此立即清理本地令牌并回到登录页
                            this.$message.success('密码修改成功，其它设备的登录已失效，请重新登录');
                            setTimeout(() => {
                                localStorage.removeItem('pms_token');
                                localStorage.removeItem('pms_token_exp');
                                localStorage.removeItem('pms_user');
                                location.href = 'index.html';
                            }, 1000);
                        })
                        .catch(err => this.$message.error(err.message));
                }
            }
        });
    </script>
</body>

</html>
