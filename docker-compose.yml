# ============================================================
#  物业管理系统 —— 一键部署编排
#
#  组成：mysql(数据库) + backend(SpringBoot 接口) + frontend(Nginx 前端+反代)
#
#  使用（在项目根目录）:
#     1. cp deploy/.env.example .env  并修改密码        （或直接跑 deploy/deploy.sh 自动生成）
#     2. docker compose up -d --build
#     3. 浏览器打开 http://服务器IP/          登录 admin / 123456
#
#  常用命令:
#     docker compose ps                查看状态
#     docker compose logs -f backend   看后端日志
#     docker compose down              停止（数据保留在数据卷里）
#     docker compose down -v           停止并删除数据卷（会清空数据库！）
# ============================================================

name: property-management-system

services:

  # ---------------- 数据库 ----------------
  mysql:
    image: mysql:8.0
    container_name: pms-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?请在 .env 里设置 MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动（数据卷为空时）自动建库+建表+导入演示数据
      - ./sql/property_db.sql:/docker-entrypoint-initdb.d/01-property_db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - pms-net

  # ---------------- 后端接口 ----------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pms-backend:1.0.0
    container_name: pms-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # 注意主机名是 mysql（compose 服务名），不是 localhost
      DB_URL: jdbc:mysql://mysql:3306/property_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      # 生产环境务必用随机长串，deploy.sh 会自动生成
      JWT_SECRET: ${JWT_SECRET:?请在 .env 里设置 JWT_SECRET}
      # 验证码答案默认永不回显（生产必须保持 false，否则等于把验证码送给攻击者）；
      # 仅当你想在服务器上跑自动化测试时才临时设为 local
      CAPTCHA_ECHO_MODE: "${CAPTCHA_ECHO_MODE:-false}"
      TZ: Asia/Shanghai
    expose:
      - "8080"          # 只在内网暴露，不对宿主机开放端口
    networks:
      - pms-net

  # ---------------- 前端界面 ----------------
  frontend:
    build:
      context: .                      # 上下文是项目根：需要 frontend/ 与 deploy/
      dockerfile: deploy/frontend.Dockerfile
    image: pms-frontend:1.0.0
    container_name: pms-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"
    networks:
      - pms-net

volumes:
  mysql-data:
    name: pms-mysql-data

networks:
  pms-net:
    name: pms-net
    driver: bridge
