# ============================================================
#  物业管理系统 —— Nginx 配置（前端静态托管 + /api 反向代理）
#
#  作用：
#    1. 把前端静态文件（HTML/JS/CSS/libs）直接托管在 80 端口
#    2. 把 /api/** 转发给后端容器 backend:8080
#       —— 前端与接口同域，于是不需要开放 8080、也没有跨域问题
#    3. 前端 config.js 会自动识别「标准端口访问」并使用同域 /api，
#       所以前端代码无需为生产环境做任何修改
# ============================================================

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 20m;

    # ---------- 接口反向代理 ----------
    # 后端 context-path 就是 /api，所以这里保持路径原样透传
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }

    # ---------- 大体积静态资源 ----------
    # 前端没有构建步骤、文件名也不带 hash，所以这里刻意「短缓存 + 每次校验」：
    # 配合 nginx 默认的 ETag/Last-Modified，未改动时走 304，既省流量又不会
    # 出现「改了代码但访问者一直看到旧页面」的经典问题。
    location ~* \.(js|css|png|jpe?g|gif|ico|svg|woff2?|ttf|otf|eot|map|glb|gltf)$ {
        add_header Cache-Control "no-cache";
        expires -1;
        try_files $uri =404;
    }

    # ---------- 前端页面 ----------
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # ---------- 压缩 ----------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1k;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/xml application/json
                      application/javascript application/xml+rss
                      application/x-javascript image/svg+xml;

    # ---------- 安全响应头 ----------
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options        SAMEORIGIN;

    # ---------- 日志 ----------
    access_log /var/log/nginx/pms.access.log;
    error_log  /var/log/nginx/pms.error.log warn;
}

# ============================================================
#  启用 HTTPS（有域名 + 证书时再打开）
#
#  前置：域名已解析到本机；证书文件放到 deploy/certs/ 并在
#        docker-compose.yml 里把 ./deploy/certs 挂载进容器。
#
#  server {
#      listen 443 ssl;
#      http2  on;
#      server_name pms.你的域名.com;
#
#      ssl_certificate     /etc/nginx/certs/fullchain.pem;
#      ssl_certificate_key /etc/nginx/certs/privkey.pem;
#      ssl_protocols       TLSv1.2 TLSv1.3;
#      ssl_ciphers         HIGH:!aNULL:!MD5;
#
#      # 其余 location 配置与上面 80 端口那份完全一致，直接复制即可
#  }
#
#  # 再把 80 端口改成强制跳转：
#  # server { listen 80; server_name pms.你的域名.com; return 301 https://$host$request_uri; }
# ============================================================
